name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Test on stable and nightly across OS matrix
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets

  # Force specific backends on x86_64 Linux
  backend-specific:
    name: Backend-specific tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: scalar
            rustflags: "-C target-cpu=x86-64-v2"
          - name: avx2
            rustflags: "-C target-cpu=haswell"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-backend-${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (${{ matrix.name }})
        run: cargo test --all-targets
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

  # AVX-512 compile check (GitHub-hosted runners rarely have AVX-512F/BW)
  avx512-compile:
    name: AVX-512 compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-avx512-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Compile with AVX-512 target
        run: cargo test --all-targets --no-run
        env:
          RUSTFLAGS: "-C target-cpu=sapphirerapids"

  # Cross-compiled QEMU test for NEON on x86_64 runner
  neon-qemu:
    name: NEON via QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets and QEMU
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu libc6-arm64-cross

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-neon-qemu-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure cargo for cross compilation
        run: |
          mkdir -p .cargo
          # qemu-aarch64 needs -L pointing at the aarch64 dynamic linker
          # (/usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1) shipped by
          # libc6-arm64-cross. Without -L it errors with
          # "Could not open '/lib/ld-linux-aarch64.so.1': No such file".
          cat > .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          runner = "qemu-aarch64 -L /usr/aarch64-linux-gnu"
          EOF

      - name: Run tests under QEMU aarch64
        run: cargo test --all-targets --target aarch64-unknown-linux-gnu

  # Clippy with strict warnings
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (pedantic)
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic

  # Format check
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Documentation build
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-doc-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # MSRV check
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Check MSRV
        run: cargo check

  # Miri check for unsafe code
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Miri can model safe Rust but cannot interpret SIMD intrinsics
      # (AVX-2 / AVX-512 / NEON) or libc::mmap/mprotect; the
      # integration suite uses both. Restrict Miri to the lib unit
      # tests; SIMD correctness is covered separately by the
      # Backend-specific and NEON-via-QEMU jobs.
      - name: Run Miri tests (lib only)
        run: cargo miri test --lib
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        timeout-minutes: 30

  # Coverage (optional, runs on stable)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # cargo-llvm-cov instead of tarpaulin — tarpaulin's ptrace-based
      # instrumentation crashes on the AVX-2 / AVX-512 / NEON intrinsics
      # this crate uses, surfacing as `SIGSEGV in <unknown>` mid-run.
      # llvm-cov uses source-based coverage (no ptrace) and handles
      # SIMD-heavy unsafe code cleanly.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-targets --workspace --codecov --output-path codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./codecov.json
          fail_ci_if_error: false
